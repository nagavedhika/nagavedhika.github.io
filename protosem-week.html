<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProtoSem Week Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }

    html {
      scroll-behavior: auto;
      background: #11101A;
      overflow-x: hidden;
      overflow-y: auto;
      height: 100%;
    }

    body {
      margin: 0;
      background: #11101A;
      color: #FFFFFF;
      font-family: "Plus Jakarta Sans", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass {
      background: linear-gradient(135deg, rgba(26, 23, 40, 0.92), rgba(17, 15, 28, 0.88)) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .font-display { letter-spacing: -0.02em; }

    .week-content {
      max-width: 1100px;
      margin: 0 auto;
    }

    .week-shell {
      background: rgba(17, 16, 26, 0.78);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      overflow: hidden;
    }

    .week-list {
      max-height: 520px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(196, 166, 255, 0.9) rgba(17, 16, 26, 0.28);
      padding-right: 0.4rem;
    }

    .week-list::-webkit-scrollbar {
      width: 8px;
    }

    .week-list::-webkit-scrollbar-track {
      background: rgba(17, 16, 26, 0.24);
      border-radius: 999px;
    }

    .week-list::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #C4A6FF, #38BDF8);
      border-radius: 999px;
      border: 2px solid rgba(17, 16, 26, 0.28);
    }

    .week-link {
      display: block;
      border-radius: 18px;
      padding: 1rem 1rem;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      transition: all 0.2s ease;
    }

    .week-link:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(196, 166, 255, 0.6);
      transform: translateY(-1px);
    }

    .week-link.active {
      background: rgba(196, 166, 255, 0.12);
      border-color: rgba(196, 166, 255, 0.8);
      box-shadow: 0 0 0 1px rgba(196, 166, 255, 0.35);
    }

    .back-btn {
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 0.85rem 1.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      border-color: rgba(196, 166, 255, 0.8);
      color: #C4A6FF;
    }
  </style>
</head>
<body class="bg-[#11101A] text-white">
  <main class="week-content px-6 py-8 md:px-10 md:py-12">
    <div class="mb-6 flex items-center justify-between gap-4">
      <button type="button" class="back-btn glass inline-flex items-center text-xs font-mono text-white" onclick="sessionStorage.setItem('protosemExpanded', 'true'); window.location.href = 'index.html#protosem';">
        ← BACK TO PORTFOLIO
      </button>
      <span class="font-mono text-[10px] md:text-xs uppercase tracking-[0.25em] text-violet">PROTOSEM // WEEK DETAILS</span>
    </div>

    <div class="week-shell glass p-4 md:p-6">
      <div class="grid grid-cols-1 lg:grid-cols-[340px_minmax(0,1fr)] gap-6">
        <aside class="glass rounded-3xl p-4 md:p-5">
          <div class="flex items-center justify-between mb-4">
            <span class="font-mono text-xs text-cyan font-bold tracking-widest">TIMELINE</span>
            <span class="font-mono text-[10px] text-slate-200 font-bold">WEEK 0 - 20</span>
          </div>
          <h2 class="text-2xl md:text-3xl font-display font-extrabold mb-4">Weekly Progression</h2>
          <div id="week-list" class="week-list space-y-3"></div>
        </aside>

        <section id="week-detail" class="min-h-[540px] rounded-3xl border border-white/10 bg-[#171426]/70 p-5 md:p-8"></section>
      </div>
    </div>
  </main>

  <script>
    const weekList = document.getElementById('week-list');
    const weekDetail = document.getElementById('week-detail');
    const urlParams = new URLSearchParams(window.location.search);
    const activeWeek = urlParams.get('week') || 'w0';

    const weekData = {
      w0: {
        label: 'WEEK 00',
        title: 'Breaking Barriers & Seeing Problems',
        intro: 'Week 0 marked the beginning of our ProtoSem journey. It was less about immediately building solutions and more about understanding people, ourselves, our surroundings, and the purpose of technology.',
        images: [
          'portfolio-content/Week_00/7ca67ec1-ce86-49e7-8206-de1e6c0b0d8c.jpeg',
          'portfolio-content/Week_00/9e593b71-d04e-4209-97cd-ebc1efd9d523.jpeg',
          'portfolio-content/Week_00/cbfacfdd-62b9-4155-a87c-38e18c568958.jpeg',
          'portfolio-content/Week_00/e975a1b6-8e39-4f08-b801-bd7a3b64eb2c.jpeg'
        ],
        body: [
          'Day 1 — Starting Conversations & 360° Interaction. We began with personal introductions and cross-disciplinary conversations, which helped us step outside our comfort zones and interact with peers we had never met before. The Rock-Paper-Scissors activity turned networking into an energetic experience, and the day then shifted to observing the world around us through real societal problems based on everyday experiences.',
          'Day 2 — Self-Awareness & Diverse Perspectives. Through 16 Personalities and Web Stories, we explored different personality types, cognitive patterns, and ways of thinking. This helped us understand that people can approach the same situation from completely different perspectives, and the same story can create different interpretations depending on the person experiencing it.',
          'Day 3 — Team Formation, Collaboration & Rapid Prototyping. Our Beta Team was formed, and an Among Us-inspired icebreaker helped break remaining tension. The Marshmallow Tower Challenge taught us about communication, experimentation, iteration, and adapting when an idea does not work. Through these activities, we began understanding each other’s strengths and working styles.',
          'Day 4 — Intentional Technology & Future Vision. The ProtoSem Inauguration Ceremony at SKT, KCT helped us understand the program’s larger purpose, and the TECH Talk on Prompt Engineering and AI Tools introduced us to prompt engineering, personalized AI workflows, and selecting the right technology for the right domain context.',
          'Week 0 Synthesis — What began with simple introductions gradually developed into collaboration, shared understanding, and stronger purpose. We learned connection, problem discovery, self-awareness, collaboration, and AI awareness. The week laid the foundation for everything that followed, showing that before building solutions, we first learned how to connect, observe, understand, collaborate, and think with purpose.'
        ]
      },
      w1: {
        label: 'WEEK 01',
        title: 'Understanding Ideas, Design & Business',
        intro: 'Week 1 built on the foundation established during Week 0 by moving from observation and collaboration toward structured thinking, design, technology, and business understanding.',
        images: [
          'assets/weekly/Week_01/01_Monday/WhatsApp%20Image%202026-09-10%20at%205.59.35%20PM.jpeg',
          'assets/weekly/Week_01/02_Tuesday/WhatsApp%20Image%202026-09-10%20at%205.59.35%20PM%20(1).jpeg',
          'assets/weekly/Week_01/03_Wednesday/WhatsApp%20Image%202026-09-10%20at%206.00.06%20PM.jpeg',
          'assets/weekly/Week_01/04_Thursday/WhatsApp%20Image%202026-09-10%20at%206.00.06%20PM%20(1).jpeg'
        ],
        body: [
          'Day 1 — Recommendation Algorithms & Design Thinking. The week began with a Tech Talk on Recommendation Algorithms, introducing us to how technology can influence the content, products, or choices presented to users. We also explored Design Thinking with Meera, focusing on approaching problems from a user-centered perspective rather than immediately jumping to solutions. The day’s activity applied these ideas to an eyewear retail scenario, allowing us to think about a real-world business problem through a design-oriented lens. Key takeaway: Understand the user and the problem before designing the solution.',
          'Day 2 — Data, Design & Business Analysis. Day 2 focused on the relationship between data, design, and business decision-making. The Tech Talk introduced us to Power BI dashboards and how data can be transformed into meaningful visual insights that support better decisions. We also explored IDEO and its approach to Design Thinking, gaining another perspective on how structured design methodologies can be applied to real-world problems. The day’s activity focused on Value Chain and SWOT Analysis, helping us look at a business from multiple angles — from how value is created to understanding its strengths, weaknesses, opportunities, and threats. Key takeaway: Good decisions come from combining data, structured thinking, and an understanding of the business.',
          'Day 3 — Onam. Day 3 was a break from the regular technical and analytical sessions as we celebrated Onam together. The celebration provided an opportunity to connect with the cohort beyond classroom activities and experience the cultural side of campus life. Key takeaway: Learning and collaboration also grow through shared experiences outside the classroom.',
          'Day 4 — Prospect Theory & Building Our Portfolio. Day 4 introduced us to Prospect Theory, exploring how people make decisions when faced with gains, losses, and uncertainty. The concept encouraged us to think about decision-making not simply as a rational process, but as something influenced by how people perceive outcomes. We also worked on our portfolios, beginning to document our learning journey, experiences, skills, and progress throughout ProtoSem. Key takeaway: Understanding how people think and make decisions is important when designing meaningful solutions.',
          'Day 5 — Technology, Motivation & Industry Perspectives. The final day brought together technology, motivation, and real-world industry perspectives. The Tech Talk on Base 44 introduced us to another technological concept/tool as part of our continuing exploration of emerging technology. We also had a Motivation session with Ram, which provided perspective on personal growth, learning, and maintaining the mindset needed throughout the ProtoSem journey. A guest lecture on Agriculture, Textile, and Retail businesses expanded our understanding of how different industries operate and the kinds of challenges they face. The week concluded with our Week 1 Presentation, giving us an opportunity to reflect on the week’s learning and communicate our understanding to the cohort. Key takeaway: Technology becomes more meaningful when we understand the people, businesses, and industries in which it is applied.',
          'Week 1 Synthesis — Week 1 expanded our perspective beyond simply identifying problems. We began learning how to analyze problems through different lenses — technology, design, data, business, and human behavior. The progression of the week can be viewed as: Technology → Design Thinking → Data → Business Analysis → Human Behavior → Industry Context. What we took away: Technology Awareness, Design Thinking, Data-Driven Thinking, Business Understanding, Human-Centered Thinking, Industry Exposure, and Reflection & Communication. Final reflection: “Week 1 taught us to look at problems from more than one angle — understanding the user, the technology, the data, the business, and the industry before thinking about a solution.”'
        ]
      },
      w2: {
        label: 'WEEK 02',
        title: 'From Problems to Prototypes',
        intro: 'Week 2 was where our learning became much more hands-on and solution-oriented. We moved from understanding problems to selecting and validating one, representing solutions through algorithms and flowcharts, experimenting with Scratch, and finally beginning to build an actual application using MIT App Inventor.',
        body: [
          'Week 2 followed a natural progression: Problem Selection → Problem Validation → Logical Thinking → Programming → App Development.',
          'Day 1 — Problem Selection & the 5S Approach. The day began with a session by Arun, where we learned how to identify and select a suitable problem statement. We spent nearly half a day exploring different problems, discussing possibilities, and narrowing them down to a problem that was worth investigating further. This process helped us understand that choosing a problem is not as simple as finding something that looks inconvenient — we need to think about its relevance, impact, and whether it can actually be addressed. In the afternoon, we explored the 5S approach at Forge. The activity gave us a practical way to observe and analyze the environment around us while applying the concepts we had learned. Key Takeaway: A good solution begins with choosing the right problem.',
          'Day 2 — Algorithms & Flowcharts. Day 2 focused on algorithms and flowcharts, with a session conducted by Gauri. Instead of simply explaining the concepts theoretically, the session involved interactive activities. We were shown YouTube videos and situations, and then asked to observe, understand, and figure out the sequence of actions or instructions ourselves. We then translated those ideas into algorithms and flowcharts, learning how to represent a process step-by-step in a structured and logical manner. The activity helped us understand that algorithms are essentially about breaking a problem or task into clear instructions, while flowcharts provide a visual representation of that logic. Key Takeaway: Before building a solution, learn to express its logic clearly and step-by-step.',
          'Day 3 — Introduction to Scratch. Day 3 introduced us to Scratch, giving us our first hands-on experience with visual programming. Rather than approaching programming in a serious or complicated way, we explored Scratch creatively as a team. We worked together and experimented with different blocks, ideas, and interactions to create funny memes and playful projects. Working as a team made the session more engaging and helped us understand the basic idea of translating our thoughts and instructions into something that a computer can execute. Key Takeaway: Programming can be learned through creativity, experimentation, and collaboration.',
          'Day 4 — Introduction to MIT App Inventor. Day 4 marked an important transition from experimenting with programming to building an actual application. We were introduced to MIT App Inventor, a platform that allows applications to be developed using visual, block-based programming. During the first half of the day, we focused on our problem statement. We reviewed and validated the problem we had selected, making sure that it was a genuine problem worth solving. Once the problem was validated, we began translating our idea into an actual app using MIT App Inventor. This was the point where the concepts we had learned throughout the week — problem identification, logical thinking, algorithms, and programming — started coming together in a practical project. Key Takeaway: Problem validation turns an idea into a meaningful project, while programming turns that idea into something usable.',
          'Week Synthesis — From Problems to Prototypes. Week 2 was a major shift in our ProtoSem journey. We moved from thinking about problems to actually beginning the process of building solutions. Our journey throughout the week looked like: Choose a Problem → Validate It → Understand the Logic → Program It → Build an App.',
          'What We Took Away: 01 — Problem Selection. We learned that choosing the right problem requires observation, discussion, and careful consideration rather than immediately jumping to a solution. 02 — Problem Validation. We learned to question whether a selected problem is genuine and meaningful before investing time in developing a solution. 03 — Computational Thinking. Algorithms and flowcharts taught us how to break a task or problem into logical, sequential instructions. 04 — Creative Programming. Scratch gave us a simple and enjoyable environment to experiment with programming while working collaboratively. 05 — From Idea to Application. MIT App Inventor allowed us to take a validated problem and begin turning our solution idea into an actual application. 06 — Team Collaboration. Across the activities, we worked together to discuss problems, create projects, experiment with ideas, and begin building our solution.',
          'Final Reflection. “Week 2 taught us that building a solution starts long before writing code. First, we need to choose the right problem, understand it, validate it, plan our logic, and only then start building.” Week 2 was the point where our ProtoSem journey began moving from ideas and observations toward experimentation and real-world solutions.'
        ]
      },
      w3: {
        label: 'WEEK 03',
        title: 'Design Thinking & Ideation',
        intro: 'Brainstorming potential tech interventions, value proposition mapping, and defining solution hypotheses.',
        body: [
          'We used design-thinking methods to turn research findings into practical ideas, focusing on AI, analytics, and digital workflows.',
          'Multiple hypotheses were assessed against feasibility, user impact, and technical complexity before narrowing attention to the strongest concept.'
        ]
      },
      w4: {
        label: 'WEEK 04',
        title: 'Solution Benchmarking & Feasibility',
        intro: 'Competitive analysis, technological feasibility studies, and initial mentor review session.',
        body: [
          'We analyzed existing solutions in related spaces to understand what was already being done and where our approach could add differentiation.',
          'Mentor feedback helped us refine the concept and evaluate which technical components were realistic within the timeline.'
        ]
      },
      w5: {
        label: 'WEEK 05',
        title: 'System Architecture & Pipeline Design',
        intro: 'Drafting the high-level system architecture, data flow diagrams, and tech stack selection.',
        body: [
          'The team defined the solution architecture, outlining the primary modules, data sequencing, and integration points between frontend, backend, and AI services.',
          'This week aligned the team around a consistent system blueprint before moving into implementation.'
        ]
      },
      w6: {
        label: 'WEEK 06',
        title: 'Database & API Specifications',
        intro: 'Database schema structuring, endpoint definition, and contract testing.',
        body: [
          'We laid out the system data model, key entities, and relationships required to support inventory, orders, and analytics flows.',
          'API contracts were defined early so that development teams could work with clear interfaces and reduce downstream integration issues.'
        ]
      },
      w7: {
        label: 'WEEK 07',
        title: 'Hardware & Phygital Touchpoint Setup',
        intro: 'Interfacing hardware sensors, POS modules, microcontrollers, and initial edge communication.',
        body: [
          'This week focused on the physical side of the phygital ecosystem, including hardware integration points and how digital processes would connect to real-world devices.',
          'We experimented with touchpoints that enabled a more connected retail workflow and identified practical integration strategies.'
        ]
      },
      w8: {
        label: 'WEEK 08',
        title: 'Mid-Term Milestone Evaluation 01',
        intro: 'First comprehensive milestone defense, architecture review, and sprint roadmap adjustments.',
        body: [
          'We presented the team’s progress to mentors and reviewers, demonstrating the evolving system concept and clarifying the next priorities.',
          'The feedback helped refine the roadmap and gave us a stronger basis for the next sprint cycle.'
        ]
      },
      w9: {
        label: 'WEEK 09',
        title: 'Prompt Engineering & AI Model Exploration',
        intro: 'Experimenting with LLMs, prompt template structuring, context windows, and retrieval frameworks.',
        body: [
          'This was the beginning of the AI-heavy experimentation loop, where we studied how prompts, context handling, and retrieval methods influence system quality.',
          'The team explored practical boundaries of model behavior and began identifying techniques for structured, useful outputs.'
        ]
      },
      w10: {
        label: 'WEEK 10',
        title: 'AI Agent Tool Calling & Integration',
        intro: 'Implementing autonomous agent tool invocation, schema validation, and structured JSON parsing.',
        body: [
          'We moved from generic prompting toward practical tool-calling patterns that let AI agents perform reliable, structured actions over application functions.',
          'This created a more robust interaction model for autonomous workflows and brought our system closer to deployment behavior.'
        ]
      },
      w11: {
        label: 'WEEK 11',
        title: 'Core Application Development - Sprint 1',
        intro: 'Developing primary application logic, backend endpoints, and connecting data ingestion pipelines.',
        body: [
          'The first major implementation sprint focused on building robust backend flows and shaping the core user-facing data interactions.',
          'By the end of the week, we had a more coherent product foundation with active application logic and interconnected modules.'
        ]
      },
      w12: {
        label: 'WEEK 12',
        title: 'Core Application Development - Sprint 2',
        intro: 'Frontend client interface build, interactive dashboards, and live state synchronization.',
        body: [
          'This sprint expanded the product surface with client-side interfaces, dashboards, and live state updates that connected the user experience to backend processes.',
          'It also helped us test whether the flow from data to UI remained intuitive and responsive during live use.'
        ]
      },
      w13: {
        label: 'WEEK 13',
        title: 'End-to-End System Integration',
        intro: 'Unifying hardware streams, backend models, and frontend UI into a coherent live workflow.',
        body: [
          'We worked on the system-wide integration layer so that data and actions moved cleanly from device touchpoints through services into the interface.',
          'The week highlighted where interface mismatches and performance bottlenecks still existed, which informed the next optimization round.'
        ]
      },
      w14: {
        label: 'WEEK 14',
        title: 'Mid-Term Milestone Evaluation 02',
        intro: 'Demonstration of working alpha prototype to industry mentors and technical advisors.',
        body: [
          'The alpha prototype was presented to mentors and technical evaluators, giving the team an opportunity to demonstrate early working capability and gather feedback.',
          'This review surfaced both strengths and gaps, helping us prioritize the final improvement cycle.'
        ]
      },
      w15: {
        label: 'WEEK 15',
        title: 'Pilot Testing & Simulated Deployment',
        intro: 'Running realistic commerce workloads, simulated foot traffic data, and concurrency benchmarking.',
        body: [
          'We ran pilot-style tests against realistic traffic scenarios to better understand how the system behaved under load and at scale.',
          'The results gave us clearer insight into runtime bottlenecks, concurrency limits, and operational stability requirements.'
        ]
      },
      w16: {
        label: 'WEEK 16',
        title: 'Performance Optimization & Bug Fixing',
        intro: 'Profiling latency bottlenecks, query optimization, and resolving edge-case error states.',
        body: [
          'This week focused on robustness and speed, with major emphasis on latency reduction, bug resolution, and eliminating edge-case failures.',
          'It helped transform the prototype from a promising concept into a more resilient application.'
        ]
      },
      w17: {
        label: 'WEEK 17',
        title: 'Business Model Canvas & Unit Economics',
        intro: 'Pricing strategy, market rollout plans, go-to-market calculations, and commercial feasibility.',
        body: [
          'We moved beyond the technical system and looked at the business layer, including pricing assumptions and rollout strategy.',
          'The goal was to ensure the solution was not only technically sound but also commercially viable and appropriately scoped.'
        ]
      },
      w18: {
        label: 'WEEK 18',
        title: 'Documentation & Presentation Deck',
        intro: 'Drafting comprehensive technical documentation, architecture whitepapers, and presentation decks.',
        body: [
          'This week focused on documentation quality, making technical decisions and architecture rationale understandable to a wider audience.',
          'The team also prepared polished presentation material for evaluation, stakeholder communication, and future reference.'
        ]
      },
      w19: {
        label: 'WEEK 19',
        title: 'Dry Run & Mock Jury Reviews',
        intro: 'Full product demo rehearsals, pitch pacing practice, and incorporation of final mock jury critique.',
        body: [
          'We rehearsed full demos, refined storytelling, and tested the clarity of the final product pitch under realistic jury conditions.',
          'Feedback from these mock reviews helped improve delivery quality, confidence, and the final presentation structure.'
        ]
      },
      w20: {
        label: 'WEEK 20',
        title: 'Grand Finale & Jury Product Pitch',
        intro: 'Final product showcase, pitch deck defense before industry experts, and project handover.',
        body: [
          'This marked the final major milestone, where the team presented the completed initiative and defended the design decisions with industry experts.',
          'The week emphasized synthesis, communication, and how well the entire ProtoSem journey translated into a strong final product story.'
        ]
      }
    };

    function renderWeekList() {
      const entries = Object.entries(weekData);
      weekList.innerHTML = entries.map(([key, item]) => `
        <a href="protosem-week.html?week=${key}" class="week-link ${key === activeWeek ? 'active' : ''}">
          <div class="flex justify-between items-center gap-3 text-xs font-mono font-bold text-cyan">
            <span>${item.label}</span>
            <span class="text-white">→</span>
          </div>
          <p class="mt-2 text-sm font-bold text-white">${item.title}</p>
        </a>
      `).join('');
    }

    function renderWeekDetail() {
      const current = weekData[activeWeek] || weekData.w0;
      weekDetail.innerHTML = `
        <div class="mb-6 flex items-center justify-between gap-4 flex-wrap">
          <div>
            <span class="font-mono text-xs text-violet font-bold tracking-[0.2em]">${current.label}</span>
            <h1 class="mt-3 text-3xl md:text-5xl font-display font-extrabold">${current.title}</h1>
          </div>
          <span class="font-mono text-[10px] md:text-xs uppercase tracking-[0.25em] text-cyan">ProtoSem</span>
        </div>

        <div class="glass rounded-3xl p-5 md:p-7 border border-white/10">
          <p class="text-base md:text-lg leading-8 text-slate-100">${current.intro}</p>
        </div>

        <div class="mt-6 grid gap-4">
          ${current.body.map((text) => `
            <div class="glass rounded-2xl p-4 md:p-5 border border-white/10">
              <p class="text-sm md:text-base leading-7 text-slate-100">${text}</p>
            </div>
          `).join('')}
        </div>

        ${current.images && current.images.length ? `
          <div class="mt-8">
            <div class="mb-4 flex items-center justify-between gap-3">
              <span class="font-mono text-xs uppercase tracking-[0.2em] text-violet font-bold">Gallery</span>
              <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-cyan">${current.images.length} images</span>
            </div>
            <div class="grid gap-4 md:grid-cols-2">
              ${current.images.map((src) => `
                <img src="${src}" alt="${current.title} photo" class="w-full h-64 object-cover rounded-2xl border border-white/10 shadow-lg shadow-black/20" loading="lazy" />
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
    }

    renderWeekList();
    renderWeekDetail();
  </script>
</body>
</html>
